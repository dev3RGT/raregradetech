<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>About Us — Rare Grade Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Learn about Rare Grade Tech — our story, why businesses across South Africa choose us, our milestones and the team behind the work." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet" />
<style>
  :root{
    --blue-900:#0A0E5A;
    --blue-800:#0D12A0;
    --blue-700:#1118F5;
    --blue-accent:#3B4CFF;
    --ink:#05060B;
    --white:#FFFFFF;
    --line:rgba(255,255,255,.16);
    --line-soft:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.07);
    --text-dim:rgba(255,255,255,.78);
    --text-faint:rgba(255,255,255,.58);

    --surface:#F5F6FC;
    --surface-alt:#FFFFFF;
    --card-line:#E5E7F6;
    --ink-900:#090B25;
    --ink-600:#54566F;
    --ink-400:#8688A0;

    --radius-s:10px;
    --radius-m:16px;
    --radius-l:28px;
    --container:1360px;
    --gap:8px;
    --nav-h:107px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--surface-alt);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  ul{margin:0;padding:0;list-style:none;}
  .wrap{max-width:var(--container);margin:0 auto;padding-inline:calc(var(--gap)*5);}
  section[id]{scroll-margin-top:96px;}

  /* ---------- Utility bar ---------- */
  .utility-bar{
    background:var(--white);
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    position:relative;
    z-index:41;
    transition:transform .6s cubic-bezier(.16,.84,.44,1), opacity .5s ease;
  }
  .utility-bar.is-hidden{
    transform:translateY(-100%);
    opacity:0;
    pointer-events:none;
  }
  .utility-bar.is-removed{
    display:none;
  }
  .utility-bar .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:calc(var(--gap)*4);
    padding-block:calc(var(--gap)*1.75);
  }
  .utility-left{display:flex;align-items:center;gap:calc(var(--gap)*4);flex-wrap:wrap;}
  .utility-item{display:flex;align-items:center;gap:calc(var(--gap)*1.25);color:var(--ink);}
  .utility-item svg{color:var(--blue-700);flex:none;}
  .utility-social{display:flex;align-items:center;gap:calc(var(--gap)*1.25);}
  .utility-social a{
    width:30px;height:30px;border-radius:50%;
    background:var(--blue-700);
    display:flex;align-items:center;justify-content:center;
    color:var(--white);
    transition:background .18s ease, transform .18s ease;
  }
  .utility-social a:hover{background:var(--ink);transform:translateY(-1px);}

  /* ---------- Nav ---------- */
  .navbar{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, rgba(6,9,55,.55), rgba(6,9,55,.0));
    transition:background .25s ease, box-shadow .25s ease, backdrop-filter .25s ease;
  }
  .navbar.scrolled{
    background:rgba(7,10,58,.92);
    backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(2,4,30,.35);
  }
  .navbar .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-block:calc(var(--gap)*0.1);
    gap:calc(var(--gap)*4);
  }
  .logo{display:flex;align-items:center;gap:calc(var(--gap)*1.5);}
  .logo-mark{width:40px;height:40px;flex:none;}
  .logo-image{height:59px;width:auto;max-width:308px;object-fit:contain;flex:none;}
  .logo-text{display:flex;flex-direction:column;line-height:1.05;}
  .logo-text .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:.01em;color:var(--white);}
  .logo-text .tag{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:2px;}

  .nav-links{display:flex;align-items:center;gap:calc(var(--gap)*4.5);}
  .nav-links a{
    font-size:14.5px;font-weight:600;color:rgba(255,255,255,.88);
    position:relative;padding-block:4px;
  }
  .nav-links a.active{color:var(--white);}
  .nav-links a.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--white);border-radius:2px;
  }
  .nav-links a:hover{color:var(--white);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-weight:700;font-size:14.5px;
    border-radius:var(--radius-s);
    padding:14px 26px;
    border:1px solid transparent;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  }
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.35);}
  .btn-secondary{background:var(--white);color:var(--ink);}
  .btn-secondary:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.18);}
  .btn-outline{background:transparent;color:var(--white);border-color:rgba(255,255,255,.4);}
  .btn-outline:hover{background:rgba(255,255,255,.1);transform:translateY(-2px);}
  .btn-block-ink{background:var(--blue-700);color:var(--white);}
  .btn-block-ink:hover{background:var(--blue-800);transform:translateY(-2px);box-shadow:0 12px 24px rgba(17,24,245,.35);}
  .btn-sm{padding:11px 20px;font-size:13.5px;}

  .nav-cta{display:none;}
  @media(min-width:900px){ .nav-cta{display:inline-flex;} }
  @media(min-width:981px){ .navbar .wrap{ min-height:var(--nav-h); } }

  .nav-toggle{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;
    width:44px;height:44px;border-radius:var(--radius-s);
    background:rgba(255,255,255,.08);border:1px solid var(--line);
    color:var(--white);cursor:pointer;
    transition:background .3s ease, border-color .3s ease;
  }
  .nav-toggle:hover{ background:rgba(255,255,255,.14); }
  .nav-toggle .burger-line{
    display:block;
    width:20px;height:2px;
    border-radius:2px;
    background:var(--white);
    transition:transform .45s cubic-bezier(.65,0,.35,1), opacity .3s ease, width .3s ease;
    transform-origin:center;
  }
  .nav-toggle[aria-expanded="true"] .burger-line:nth-child(1){ transform:translateY(7px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] .burger-line:nth-child(2){ opacity:0; width:0; }
  .nav-toggle[aria-expanded="true"] .burger-line:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
  @media(min-width:900px){ .nav-toggle{display:none;} }

  .mobile-panel{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    overflow:hidden;
    background:#0E16F5;
    backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    transition:grid-template-rows .55s cubic-bezier(.22,1,.36,1), opacity .4s ease;
  }
  .mobile-panel.open{
    grid-template-rows:1fr;
    opacity:1;
  }
  .mobile-panel-inner{
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:calc(var(--gap)*1);
    padding:calc(var(--gap)*3) calc(var(--gap)*5) calc(var(--gap)*4);
  }
  .mobile-panel-inner > *{
    opacity:0;
    transform:translateY(-8px);
    transition:opacity .4s ease, transform .45s cubic-bezier(.22,1,.36,1);
  }
  .mobile-panel.open .mobile-panel-inner > *{
    opacity:1;
    transform:translateY(0);
  }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(1){ transition-delay:.05s; }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(2){ transition-delay:.09s; }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(3){ transition-delay:.13s; }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(4){ transition-delay:.17s; }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(5){ transition-delay:.21s; }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(6){ transition-delay:.25s; }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(7){ transition-delay:.29s; }
  .mobile-panel.open .mobile-panel-inner > *:nth-child(8){ transition-delay:.33s; }
  .mobile-panel a{
    color:#FFFFFF !important;
    font-weight:600;font-size:15px;padding:10px 0;
    transition:opacity .25s ease, transform .25s ease;
  }
  .mobile-panel a:hover, .mobile-panel a:active{ opacity:.8; }
  .mobile-panel .btn{margin-top:calc(var(--gap)*1.5);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    background:linear-gradient(155deg, var(--blue-700) 0%, #171FE0 22%, #131AAE 46%, var(--blue-900) 78%, #080B45 100%);
    min-height:92vh;
    display:flex;
    align-items:stretch;
    margin-top:calc(-1 * var(--nav-h));
    padding-top:var(--nav-h);
  }
  .hero-texture{
    position:absolute;inset:0;
    background-image:url('https://i.postimg.cc/QdQW2r95/hero.png');
    background-size:cover;
    background-position:60% 30%;
    z-index:0;
    pointer-events:none;
  }
  .hero-overlay{
    position:absolute;inset:0;
    background:
      linear-gradient(90deg, rgba(5,6,20,.88) 0%, rgba(7,9,40,.62) 30%, rgba(9,12,60,.34) 55%, rgba(9,12,60,.16) 76%, rgba(9,12,60,.08) 100%),
      linear-gradient(155deg, rgba(17,24,245,.34) 0%, rgba(23,31,224,.26) 22%, rgba(19,26,174,.28) 46%, rgba(10,14,90,.36) 78%, rgba(8,11,69,.42) 100%);
    z-index:0;
    pointer-events:none;
  }
  .hero-color-overlay{
    position:absolute;inset:0;
    background:linear-gradient(90deg, #020084 0%, #0404d8 100%);
    mix-blend-mode:multiply;
    opacity:.82;
    z-index:0;
    pointer-events:none;
  }
  .hero-rays{
    position:absolute;inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(60% 55% at 82% 30%, rgba(255,255,255,.16), transparent 60%),
      conic-gradient(from 205deg at 78% 22%, rgba(255,255,255,.09), transparent 18%, transparent 82%, rgba(255,255,255,.07));
    filter:blur(30px);
    opacity:.9;
  }
  .hero-radial{
    position:absolute;right:-6%;top:6%;width:64%;height:96%;
    z-index:0;pointer-events:none;
    background:radial-gradient(closest-side, rgba(120,140,255,.38), rgba(120,140,255,.12) 55%, transparent 72%);
    filter:blur(10px);
  }
  @media (prefers-reduced-motion:no-preference){ .hero-rays{animation:driftGlow 16s ease-in-out infinite alternate;} }
  @keyframes driftGlow{ from{opacity:.75; transform:translateY(0);} to{opacity:1; transform:translateY(-1.5%);} }

  .hero-inner{
    position:relative;z-index:2;width:100%;max-width:var(--container);margin:0 auto;
    padding:calc(var(--gap)*2) calc(var(--gap)*5) calc(var(--gap)*5);
    display:grid;grid-template-columns:1.08fr .92fr;align-items:end;gap:calc(var(--gap)*4);
  }
  .hero-left{padding-bottom:calc(var(--gap)*4);padding-top:calc(var(--gap)*1);}

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:#000000;border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(8px);padding:9px 18px;border-radius:999px;
    font-size:13px;font-weight:700;letter-spacing:.02em;margin-bottom:calc(var(--gap)*3.5);
    color:var(--white);
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 10px #FFFFFF;}

  .headline{
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(2.6rem, 4.6vw, 5.2rem);line-height:.92;letter-spacing:0;
    margin:0 0 calc(var(--gap)*3.5);color:var(--white);text-wrap:balance;text-transform:uppercase;
  }
  .headline-l2{display:inline-block;margin-top:14px;}
  .subcopy{
    font-size:clamp(15px,1.15vw,17.5px);line-height:1.65;color:var(--text-dim);
    max-width:520px;margin:0 0 calc(var(--gap)*4.5);font-weight:400;
  }
  .cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--gap)*2);margin-bottom:calc(var(--gap)*5.5);}

  .rating-card{display:flex;align-items:center;gap:14px;background:none;color:var(--white);border-radius:0;padding:0;}
  .rating-icons-img{height:42px;width:auto;display:block;flex:none;}
  .rating-star-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;}
  .rating-star-svg{position:absolute;inset:0;width:100%;height:100%;}
  .rating-number{position:relative;z-index:1;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:15px;line-height:1;color:#0B0E2A;margin-top:2px;}
  .rating-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#FFB73D;margin-top:5px;}

  .services-card{
    background:var(--blue-800);border:1px solid rgba(255,255,255,.16);
    border-radius:var(--radius-l);padding:calc(var(--gap)*4) calc(var(--gap)*3);
    display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--gap)*2);
  }
  .service-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--gap)*1.75);padding-left:calc(var(--gap)*2.5);border-left:1px dashed rgba(255,255,255,.28);}
  .service-item:first-child{border-left:none;padding-left:0;}
  .service-icon{width:auto;height:auto;flex:none;border-radius:0;display:flex;align-items:center;justify-content:center;background:none;}
  .service-item svg{width:21px;height:21px;color:var(--white);}
  .service-item img{width:44px;height:44px;object-fit:contain;filter: drop-shadow(0 6px 12px rgba(0,0,0,.3));}
  .service-item span{font-size:12.5px;font-weight:600;line-height:1.3;color:rgba(255,255,255,.92);}

  .trust-row{grid-column:1 / -1;order:3;display:flex;flex-wrap:nowrap;align-items:flex-start;gap:calc(var(--gap)*5);margin-top:calc(var(--gap)*4.5);padding-top:calc(var(--gap)*4);border-top:5px solid #FFFFFF;}
  .trust-item{display:flex;align-items:flex-start;gap:calc(var(--gap)*1.75);flex:1 1 0;min-width:0;}
  .trust-item .icon-wrap{width:42px;height:42px;flex:none;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .trust-item svg{width:20px;height:20px;color:var(--white);}
  .trust-item .t-title{font-size:14px;font-weight:700;line-height:1.3;color:var(--white);white-space:nowrap;}
  .trust-item .t-sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;line-height:1.4;}

  .hero-right{position:relative;height:100%;min-height:560px;overflow:visible;}
  .team-photo{position:absolute;left:50%;bottom:0;z-index:2;width:118%;max-width:none;height:auto;object-fit:contain;object-position:bottom;transform:translateX(-50%);filter:drop-shadow(0 40px 60px rgba(2,4,30,.55));animation:heroPhotoIn 1.1s cubic-bezier(.16,.84,.44,1) .2s both;}
  @keyframes heroPhotoIn{ from{opacity:0; transform:translateX(-50%) translateY(56px) scale(.96);} to{opacity:1; transform:translateX(-50%) translateY(0) scale(1);} }

  @media (min-width:1200px){ .hero-inner{grid-template-columns:1.15fr .95fr;} }

  /* ---------- Shared section system ---------- */
  .section{padding-block:calc(var(--gap)*9);}
  .section-tint{background:var(--surface);}
  .section-dark{background:linear-gradient(165deg,#0A0E5A 0%,#0D12A0 55%,#0A0E5A 100%);color:var(--white);position:relative;overflow:hidden;}
  .section-head{max-width:640px;margin-bottom:calc(var(--gap)*7);}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-700);margin-bottom:calc(var(--gap)*2);}
  .section-dark .eyebrow{color:#9FB0FF;}
  .eyebrow::before{content:"";width:20px;height:2px;background:currentColor;border-radius:2px;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.9rem,2.6vw,2.75rem);line-height:1.08;letter-spacing:-.01em;margin:0 0 calc(var(--gap)*2);}
  .section-sub{font-size:15.5px;line-height:1.7;color:var(--ink-600);margin:0;}
  .section-dark .section-sub{color:rgba(255,255,255,.72);}
  .section-head.center{margin-inline:auto;text-align:center;}
  .section-head.center .eyebrow::before{display:none;}

  /* Services */
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--gap)*3);}
  .service-card{background:var(--surface-alt);border:1px solid var(--card-line);border-radius:var(--radius-m);padding:calc(var(--gap)*4);transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
  .service-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(15,20,90,.08);border-color:transparent;}
  .service-card .icon-badge{width:auto;height:auto;border-radius:0;background:none;display:flex;align-items:center;justify-content:flex-start;margin-bottom:calc(var(--gap)*2.5);}
  .service-card .icon-badge svg{width:26px;height:26px;color:var(--white);}
  .service-card .icon-badge img{width:72px;height:72px;object-fit:contain;display:block;}
  .service-card h3{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;margin:0 0 calc(var(--gap)*1.75);color:var(--ink-900);}
  .service-card ul{display:flex;flex-direction:column;gap:calc(var(--gap)*1.1);}
  .service-card li{display:flex;align-items:flex-start;gap:8px;font-size:13.8px;color:var(--ink-600);line-height:1.5;}
  .service-card li svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--blue-700);}

  /* Solutions */
  .solution-card{background:var(--surface-alt);border-radius:var(--radius-m);padding:calc(var(--gap)*4);border:1px solid var(--card-line);}
  .solution-card .num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--blue-700);letter-spacing:.06em;margin-bottom:calc(var(--gap)*2);}
  .solution-card h3{font-family:'Space Grotesk',sans-serif;font-size:18.5px;font-weight:700;margin:0 0 calc(var(--gap)*1.25);color:var(--ink-900);}
  .solution-card p{font-size:14px;color:var(--ink-600);line-height:1.6;margin:0;}

  /* Portal CTA */
  .portal-cta{background:linear-gradient(160deg,#0A0E5A,#171FE0 65%,#0A0E5A);position:relative;overflow:hidden;}
  .portal-copy{max-width:620px;}
  .portal-copy h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.8rem,2.6vw,2.6rem);font-weight:700;margin:0 0 calc(var(--gap)*2);color:#FFFFFF;}
  .portal-copy p{font-size:15px;line-height:1.7;color:rgba(255,255,255,.75);margin:0;}
  .portal-features{display:flex;flex-direction:column;gap:calc(var(--gap)*2);min-width:260px;}
  .portal-features .pf-item{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.9);}
  .portal-features svg{width:18px;height:18px;color:#FFFFFF;flex:none;}

  /* Contact */
  .contact-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:calc(var(--gap)*6);align-items:start;}
  .contact-info{display:flex;flex-direction:column;gap:calc(var(--gap)*3);}
  .contact-info-item{display:flex;gap:calc(var(--gap)*2);background:var(--surface-alt);border:1px solid var(--card-line);border-radius:var(--radius-m);padding:calc(var(--gap)*2.5);align-items:flex-start;}
  .contact-info-item .icon-wrap{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(145deg,var(--blue-700),var(--blue-900));display:flex;align-items:center;justify-content:center;}
  .contact-info-item .icon-wrap svg{width:19px;height:19px;color:var(--white);}
  .contact-info-item h4{margin:0 0 3px;font-size:14.5px;font-weight:700;color:var(--ink-900);}
  .contact-info-item p{margin:0;font-size:13.8px;color:var(--ink-600);line-height:1.5;}
  .contact-social{display:flex;gap:10px;margin-top:calc(var(--gap)*1);}
  .contact-social a{width:38px;height:38px;border-radius:50%;background:var(--blue-700);display:flex;align-items:center;justify-content:center;color:var(--white);transition:background .2s ease,transform .2s ease;}
  .contact-social a:hover{background:var(--ink-900);transform:translateY(-2px);}

  .contact-form{background:#000000;border-radius:var(--radius-l);padding:calc(var(--gap)*5);color:var(--white);}
